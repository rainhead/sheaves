[workspace]
resolver = "3"
members = ["crates/sheaves-core", "crates/sheaves-gnome", "crates/uniffi-bindgen"]
# The GNOME app needs GTK 4 and libadwaita to build, which a Mac does not have, so
# plain `cargo test` leaves it out; on Linux, `cargo test -p sheaves-gnome`.
default-members = ["crates/sheaves-core", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# The library and the bindings generator must be the same version: the generated
# Swift checks a checksum of every exported function against the library at load
# time and refuses to run on a mismatch. One line pins both.
uniffi = "=0.32.2"

# The core ships inside the Mac app twice over, once per architecture, so its size
# is the app's download size.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
