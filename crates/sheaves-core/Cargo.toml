[package]
name = "sheaves-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib for the Mac app's XCFramework; lib for Rust callers (the GNOME app and
# the tests).
crate-type = ["lib", "staticlib"]
name = "sheaves_core"

[dependencies]
async-trait = "0.1.92"
directories = "6.0.0"
jiff = { version = "0.2.39", features = ["serde"] }
log = { version = "0.4.35", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
uniffi.workspace = true
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "test-util"] }

# TLS from the system where it has one: Security.framework on a Mac, which costs the
# app nothing to carry. Elsewhere rustls, so a Linux build needs no OpenSSL.
[target.'cfg(target_vendor = "apple")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
