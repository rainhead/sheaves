[package]
name = "uniffi-bindgen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The bindings generator, built from the same uniffi version as the library so the
# two cannot drift. Run it as `cargo run -p uniffi-bindgen -- …`; see
# Scripts/build-xcframework.sh.
[dependencies]
uniffi = { workspace = true, features = ["cli"] }
