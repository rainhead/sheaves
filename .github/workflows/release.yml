name: Release

# Tag-driven: bump MARKETING_VERSION in project.yml, commit, then push a matching
# `v` tag. The publish job refuses a tag that disagrees with the version the built
# app reports, so a release cannot claim to be something the binary does not.
on:
  push:
    tags: ["v*"]

# Releases do not race, and an interrupted one leaves a half-made release behind.
# The name is deliberately unlike anything build.yml computes: inside a called
# workflow `github.workflow` is the *caller's* name, so build.yml's group becomes
# "Release-<ref>" here — and group names match case-insensitively, which would put
# the called workflow and the run that called it in one group, the called half
# cancelling its own caller.
concurrency:
  group: sheaves-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: test
    runs-on: macos-26
    permissions:
      # Creating the release, and attesting where the zip came from: the
      # attestation is signed with a certificate GitHub issues for this
      # workflow's identity, so it needs an OIDC token.
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      # The app links the Rust core; rust-toolchain.toml names the compiler.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      # The same script a developer runs locally, so what ships has been
      # rehearsed rather than assembled for the first time here.
      - name: Package
        id: package
        run: Scripts/package-release.sh

      # Compared against the app's own CFBundleShortVersionString rather than
      # against project.yml, because that is the number a user reads in About
      # and the one a bug report will quote.
      - name: Check the tag matches the app's version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the app's version $VERSION." \
                 "Bump MARKETING_VERSION in project.yml, or retag."
            exit 1
          fi

      # Anyone can check the download came from this workflow at this tag:
      # `gh attestation verify Sheaves-0.2.0.zip --repo rainhead/sheaves`.
      - name: Attest where the zip came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # The body is prepended to GitHub's generated notes, so the install
          # steps lead and the commit log follows. Gatekeeper blocks this build
          # outright — it is signed ad-hoc, which is not a distribution identity
          # — so saying how to get past it is not optional.
          gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --generate-notes \
            --notes "$(cat <<'NOTES'
          **GNOME (Ubuntu 26.04):** download the `.deb` below and install it with
          `sudo apt install ./sheaves_*_amd64.deb`. Then open Sheaves from the app grid.

          **Mac:** download the zip below, unpack it, and move `Sheaves.app` to `/Applications`.

          To check that a download was built by this repository's release workflow at
          this tag: `gh attestation verify <file> --repo rainhead/sheaves`.

          macOS will refuse to open it: this build is signed ad-hoc rather than with a
          Developer ID, which needs a paid Apple Developer Program membership. Clear the
          quarantine flag to open it anyway:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Sheaves.app
          ```

          The signature also changes with every build, so macOS treats each release as a
          different app and asks again for Keychain access to the Harvest token.
          NOTES
          )"

  # The GNOME app's package, added to the release the Mac job just made, so one
  # tag publishes both. Same runner and version of Ubuntu as the GNOME tests.
  deb:
    name: Publish the .deb
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Install cargo-deb
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deb@3.8.0

      # Versioned by the tag, which the publish job has already checked against
      # the Mac app's version, so both downloads carry the same number.
      - name: Build the .deb
        env:
          TAG: ${{ github.ref_name }}
        run: cargo deb --locked -p sheaves-gnome --deb-version "${TAG#v}"

      - name: Attest where the .deb came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/debian/*.deb

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" target/debian/*.deb
