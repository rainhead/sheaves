name: CodeQL

# Replaces GitHub's default CodeQL setup, which builds the Swift package by itself
# and fails because the package needs the Rust core built first
# (Scripts/build-xcframework.sh). Default setup must stay off in the repo's
# settings, or GitHub rejects the results this workflow uploads.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Read from source, so quick enough to run on every pull request.
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL does not need the crate compiled.
        language: [actions, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Swift is analysed by watching the compiler build the whole app, Rust core
  # included, which takes over twenty minutes. Little Swift changes now that the
  # rules live in the core, so it runs after a merge and weekly, not on each pull
  # request; a finding then arrives minutes after the merge instead of before it.
  analyze-swift:
    name: Analyze (swift)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Everything the Swift build needs, done before CodeQL starts watching. Once
      # it does, it traces each process under Rosetta, where Homebrew refuses to
      # install and cargo runs several times slower. The steps are build.yml's,
      # which explains each of them.
      - name: Prepare the Swift build
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          rustup toolchain install --no-self-update
          Scripts/build-xcframework.sh
          brew install --quiet xcodegen
          xcodegen generate

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      # Builds the app and, with it, the SheavesCore package.
      - name: Build
        run: |
          xcodebuild build \
            -project Sheaves.xcodeproj \
            -scheme Sheaves \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
