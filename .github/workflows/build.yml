name: Build

on:
  # Prose changes build nothing worth testing.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  # Called by the release workflow, so a release runs the same suite on the same
  # toolchain rather than a second copy of it that can drift.
  workflow_call:

# A second push supersedes the first; nothing here is worth finishing twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    # macos-26 ships Xcode 26.6 by default, which is what the package's Swift 6
    # language mode and onGeometryChange need.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than relying on the image default, so a runner image bump
      # cannot silently change the compiler under us.
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      # rustup is on the image. With no arguments it installs what
      # rust-toolchain.toml names: the pinned compiler and both Mac targets.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Show toolchain
        run: swift --version && xcodebuild -version && cargo --version

      - name: Test Rust core
        run: cargo test --locked

      # The core has code only the Mac builds, such as its TLS, so it is linted
      # here as well as on Ubuntu.
      - name: Lint Rust core
        run: cargo clippy --locked -p sheaves-core --all-targets -- --deny warnings

      - name: Build Rust core for the Swift package
        run: Scripts/build-xcframework.sh

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      # The .xcodeproj is generated, not committed.
      - name: Generate project
        run: xcodegen generate

      - name: Test core
        run: swift test --package-path Packages/SheavesCore

      # Signing is ad-hoc by default (Config/Base.xcconfig); Config/Local.xcconfig
      # is git-ignored, so CI needs no signing secrets.
      - name: Test app
        run: |
          xcodebuild test \
            -project Sheaves.xcodeproj \
            -scheme Sheaves \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  gnome:
    name: GNOME app
    # The release Hostess runs, so CI builds against the same GTK and libadwaita.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GNOME's settings daemon's schemas too, which the quick entry shortcut is
      # kept in; its tests fail without them here, rather than skip.
      - name: Install GTK 4, libadwaita and GNOME's settings schemas
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgtk-4-dev libadwaita-1-dev gnome-settings-daemon-common

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # Once, here: formatting is the same on every machine.
      - name: Check formatting
        run: cargo fmt --all --check

      # The GNOME app is not a default member, so the workspace is named whole.
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- --deny warnings

      # On Linux the core uses rustls and keeps its files where GNOME expects,
      # neither of which the Mac's run of the same tests reaches.
      - name: Test Rust core
        run: cargo test --locked

      - name: Test GNOME app
        run: cargo test --locked -p sheaves-gnome
