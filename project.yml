name: Sheaves
options:
  bundleIdPrefix: com.rainhead
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  groupSortPosition: top

packages:
  SheavesCore:
    path: Packages/SheavesCore

# Signing lives in an xcconfig so a checkout builds ad-hoc for anyone, while this
# machine can opt into a real team without editing a tracked file.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Sheaves:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
    dependencies:
      - package: SheavesCore
        product: SheavesCore
    info:
      path: Apps/Mac/Resources/Info.plist
      properties:
        CFBundleName: Sheaves
        CFBundleDisplayName: Sheaves
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu bar app: no Dock icon, no main window on launch.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT licensed"
    entitlements:
      path: Apps/Mac/Resources/Sheaves.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rainhead.Sheaves
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  SheavesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/Mac/Tests
    dependencies:
      - target: Sheaves
      - package: SheavesCore
        product: SheavesCore
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sheaves.app/Contents/MacOS/Sheaves
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rainhead.SheavesTests

schemes:
  Sheaves:
    build:
      targets:
        Sheaves: all
        SheavesTests: [test]
    test:
      config: Debug
      targets:
        - SheavesTests
    run:
      config: Debug
